[package]
name = "lords_gui"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "lords_simulator"

[lints]
workspace = true

[dependencies]
lords_runtime = { path = "../lords_runtime" }
lords_save = { path = "../lords_save" }
lords_sim = { path = "../lords_sim" }
eframe = { workspace = true, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
egui.workspace = true
env_logger = "0.11.8"
log.workspace = true
serde.workspace = true

[[bin]]
name = "lords_simulator"
path = "src/main.rs"

[dev-dependencies]
tempfile.workspace = true
